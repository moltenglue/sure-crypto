# ===========================================================================
# Rotki Integration Compose File
# ===========================================================================
#
# Usage:
#   docker-compose -f compose.example.yml -f compose.rotki.yml up -d
#
# This adds the Rotki service to the standard Sure stack

services:
  rotki:
    image: rotki/rotki:latest
    container_name: sure-rotki
    ports:
      - "5042:4242"
    volumes:
      - rotki-data:/data
    environment:
      - ROTKI_IS_HEADLESS=true
      - API_UPLOAD_BACKEND_HOST=0.0.0.0
      - ROTKI_PORT=4242
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4242/api/1/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sure_net

volumes:
  rotki-data:
