name: Sync from upstream

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/we-promise/sure.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if merge needed
        id: check
        run: |
          upstream_sha=$(git rev-parse upstream/main)
          current_sha=$(git rev-parse HEAD)
          if [ "$upstream_sha" != "$current_sha" ]; then
            echo "updates=true" >> $GITHUB_OUTPUT
          else
            echo "updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream
        if: steps.check.outputs.updates == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git merge upstream/main --no-edit || echo "Merge conflict - manual intervention needed"

      - name: Push
        if: steps.check.outputs.updates == 'true'
        run: |
          git push origin main || echo "Push failed - manual intervention needed"
