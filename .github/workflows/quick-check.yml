name: Quick Check

on:
  pull_request:
    branches: [ main ]

jobs:
  quick-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sure
          POSTGRES_PASSWORD: sure_test_password
          POSTGRES_DB: sure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://sure:sure_test_password@localhost:5432/sure_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY_BASE: test_secret_key_base_for_github_actions
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Setup database
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate

      - name: Run Critical Rotki Tests
        run: |
          echo "Running critical Rotki tests..."
          bundle exec rails test test/services/rotki/balance_cache_test.rb test/services/rotki/mapper_test.rb test/models/concerns/rotki_user_concern_test.rb test/controllers/api/v1/rotki_controller_test.rb --verbose

      - name: Check for security issues
        run: |
          bundle exec brakeman -q -w2 -o /dev/null